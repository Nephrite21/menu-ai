# 메뉴 제안 이슈 -> 검증 -> data/menus/user-suggestions.json 추가 -> 검토용 PR (C 소유)
#
# 보안 원칙(이슈 본문은 신뢰할 수 없는 입력):
#  - 이슈 본문/제목/작성자를 `${{ }}` 로 셸 스크립트에 보간하지 않는다. 본문은 scripts/issue-to-menu.mjs 가
#    GITHUB_EVENT_PATH(이벤트 JSON 파일)에서 직접 JSON.parse 해서 읽고, validate 규칙을 통과한 필드만 반영한다.
#  - 셸에 들어가는 값은 (a) 정수인 issue.number, (b) 기본 브랜치 이름, (c) 스크립트가 만든 고정 형식 토큰(branch)뿐이며
#    모두 env 로 전달하고 항상 "$VAR" 로 따옴표 처리한다. PR 제목/본문/코멘트는 파일(--body-file)로 전달한다.
#  - 트리거는 `issues`(기본 브랜치의 워크플로/스크립트만 실행). pull_request_target 은 사용하지 않는다.
#  - 권한은 job 단위 최소(contents/pull-requests/issues write), 워크플로 기본 권한은 없음.
#  - 외부 코드를 내려받거나 실행하지 않는다(npm install 없음, 서드파티 액션은 공식 checkout/setup-node 뿐).
#
# 저장소 설정 필요: Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests" 켜기.
# 참고: GITHUB_TOKEN 으로 만든 PR 에는 다른 워크플로(CI)가 자동 실행되지 않는다. 병합 전에 검토자가 PR 의 JSON 을 확인한다.
# 주의: 여러 제안 PR 이 같은 파일 끝에 항목을 추가하므로, 두 번째부터는 앞선 PR 병합 뒤 충돌이 날 수 있다(순서대로 병합 권장).
name: Issue to PR (menu suggestion)

on:
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: issue-to-pr
  cancel-in-progress: false

jobs:
  suggest:
    # 라벨/제목은 실행 여부 판단에만 사용한다(셸로 전달하지 않음).
    if: >-
      contains(github.event.issue.labels.*.name, 'menu-suggestion') ||
      startsWith(github.event.issue.title, '[메뉴 제안]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER_INT: ${{ github.event.issue.number }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 본문은 이 스크립트가 이벤트 JSON 에서 직접 읽는다(인자/보간 없음).
      - name: Parse and validate issue
        id: parse
        run: node scripts/issue-to-menu.mjs

      - name: Comment and close (rejected)
        if: steps.parse.outputs.status == 'rejected'
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER_INT" --body-file .issue-result/comment.md
          gh issue close "$ISSUE_NUMBER_INT" --reason "not planned"

      - name: Check open suggestion PR backlog
        id: backlog
        if: steps.parse.outputs.status == 'ok'
        run: |
          set -euo pipefail
          open_count="$(gh pr list --state open --label menu-suggestion --json number --jq 'length')"
          if [ "$open_count" -ge 30 ]; then
            echo "too_many=true" >> "$GITHUB_OUTPUT"
          else
            echo "too_many=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment (backlog full)
        if: steps.parse.outputs.status == 'ok' && steps.backlog.outputs.too_many == 'true'
        run: |
          set -euo pipefail
          printf '%s\n' '검토 대기 중인 제안 PR이 많아 지금은 새 PR을 만들지 않았어요. 잠시 뒤에 다시 제안해 주세요.' > .issue-result/backlog.md
          gh issue comment "$ISSUE_NUMBER_INT" --body-file .issue-result/backlog.md

      - name: Create branch, commit and pull request
        if: steps.parse.outputs.status == 'ok' && steps.backlog.outputs.too_many == 'false'
        env:
          BRANCH: ${{ steps.parse.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # 이 파일 하나만 스테이징한다.
          git add -- data/menus/user-suggestions.json
          if git diff --cached --quiet; then
            echo "변경 사항이 없어 PR을 만들지 않습니다."
            exit 0
          fi
          git commit -m "feat(data): add menu suggestion from issue #${ISSUE_NUMBER_INT}"
          git push origin "$BRANCH"
          gh label create menu-suggestion --color 0E8A16 --description "Menu suggestion from issue form" --force || true
          PR_URL="$(gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --title "$(cat .issue-result/pr-title.txt)" \
            --body-file .issue-result/pr-body.md \
            --label menu-suggestion)"
          { cat .issue-result/comment.md; printf '\nPR: %s\n' "$PR_URL"; } > .issue-result/final-comment.md
          gh issue comment "$ISSUE_NUMBER_INT" --body-file .issue-result/final-comment.md
