<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘 뭐 먹지</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body class="page-home">
<canvas id="bg-sphere" aria-hidden="true"></canvas>
<div class="bokeh" aria-hidden="true"></div>

<header class="topbar">
  <a class="brand" href="index.html">Menu<span>AI</span></a>
  <nav>
    <a href="index.html" aria-current="page">추천</a>
    <a href="list.html">전체 메뉴</a>
    <button type="button" data-open-add>이게 없다고?</button>
  </nav>
</header>

<main class="stage">
  <div class="hero">
    <div class="hero-title">MENU AI</div>

    <div class="progress-box" id="progress-box" hidden>
      <div class="muted" id="progress-label">모델 로딩</div>
      <div class="progress"><div id="progress-bar"></div></div>
    </div>

    <form class="searchbar" role="search" onsubmit="return false">
      <input type="text" id="situation" placeholder="무엇이 드시고 싶으신가요?" autocomplete="off" aria-label="지금 상황">
      <button type="button" id="search" class="sb-search" aria-label="검색">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span>검색</span>
      </button>
    </form>

    <button type="button" class="detail-link" id="detail-link" aria-expanded="false" aria-controls="detail">
      <span id="detail-link-text">또는 상세 설정 열기</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="hint">+재료 / ++재료 / -재료 / !재료(제외)도 입력할 수 있어요</div>

    <div class="detail glass" id="detail" hidden>
      <section><h2>상황 프리셋</h2><div class="chips" id="presets"></div></section>
      <section><h2>음식 종류 (여러 개 선택)</h2><div class="chips" id="cuisines"></div></section>
      <section>
        <h2>재료 가중치 · 클릭할 때마다 중립 → + → ++ → − → ✕</h2>
        <div class="chips" id="ingredients"></div>
      </section>
    </div>
  </div>

  <section class="results-zone" id="results-zone">
    <div class="results-bar">
      <h2>추천 메뉴</h2>
      <button class="btn" id="reroll" type="button">다른 거 추천</button>
    </div>
    <div class="results" id="results"></div>
  </section>
</main>

<footer class="foot" id="footer">출처: (데이터 출처·라이선스 표기 자리) · 아이콘: <a href="https://lucide.dev" style="color:inherit">Lucide</a> (ISC)</footer>

<script src="ui/icons.js"></script>
<script src="ui/sphere.js"></script>
<script src="ui/ui.js"></script>
<script src="ui/mock.js"></script>
<script>
(function(){
const {$,el,emit,CUISINES}=window.MenuUI;
const PRESETS=['비 오는 날','해장','혼밥','야식','다이어트','기념일','더운 날','추운 날'];
const INGS=['닭고기','소고기','돼지고기','해산물','생선','계란','두부','김치','치즈','면','밥','채소'];
const CYCLE=['0','1','2','-1','x'],MARK={'0':'','1':'+','2':'++','-1':'−','x':'✕'};
const sit=$('#situation');

PRESETS.forEach(p=>$('#presets').append(el('button',{className:'chip',type:'button',textContent:p,onclick:()=>{
  sit.value=(sit.value.trim()+' '+p).trim();sit.focus();}})));

CUISINES.filter(([v])=>v!=='other').forEach(([v,k])=>{
  const b=el('button',{className:'chip',type:'button',textContent:k});
  b.dataset.v=v;b.setAttribute('aria-pressed','false');
  b.onclick=()=>b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');
  $('#cuisines').append(b);
});

INGS.forEach(n=>{
  const b=el('button',{className:'chip w',type:'button'},el('span',{className:'mark'}),n);
  b.dataset.w='0';b.dataset.name=n;
  b.onclick=()=>{b.dataset.w=CYCLE[(CYCLE.indexOf(b.dataset.w)+1)%CYCLE.length];b.firstChild.textContent=MARK[b.dataset.w]};
  $('#ingredients').append(b);
});

/* 상세 설정 열기/닫기 */
function toggleDetail(){
  const open=$('#detail').hidden;$('#detail').hidden=!open;
  $('#detail-link').setAttribute('aria-expanded',String(open));
  $('#detail-link-text').textContent=open?'상세 설정 닫기':'또는 상세 설정 열기';
}
$('#detail-link').onclick=toggleDetail;

function collect(){
  const weights={},exclude=[];
  document.querySelectorAll('#ingredients .chip').forEach(b=>{
    const w=b.dataset.w;if(w==='0')return;
    if(w==='x')exclude.push(b.dataset.name);else weights[b.dataset.name]=Number(w);
  });
  return{text:sit.value.trim(),cuisines:[...document.querySelectorAll('#cuisines [aria-pressed=true]')].map(b=>b.dataset.v),weights,exclude};
}
/* 검색: 구가 돌다가 아이콘 하나로 확대되며 결과 화면으로 전환 (결과는 전환이 끝난 뒤 표시) */
/* 검색마다 AbortController를 만든다. 로직은 detail.signal 을 보고 진행 중인 계산을 중단해야 한다.
   이전 검색이 아직 진행 중이면 먼저 취소하고, 실패(타임아웃/오류) 때도 취소한다. */
function newSearch(){
  const prev=window.MenuUI.search;if(prev)prev.ac.abort();
  const ac=new AbortController();window.MenuUI.search={ac};return ac;
}
document.addEventListener('menu:search-failed',()=>{const s=window.MenuUI.search;if(s)s.ac.abort()});
$('#search').onclick=()=>{
  const ac=newSearch();
  if(window.MenuSphere){
    const d=window.MenuSphere.dive();window.MenuUI.diving=d;
    d.then(()=>{if(window.MenuUI.diving===d)window.MenuUI.diving=null});
  }
  emit('menu:search',{...collect(),signal:ac.signal});
};
$('#reroll').onclick=()=>{
  const ac=newSearch();
  if(window.MenuSphere){
    const d=window.MenuSphere.spin();window.MenuUI.diving=d;
    d.then(()=>{if(window.MenuUI.diving===d)window.MenuUI.diving=null});
  }
  emit('menu:reroll',{signal:ac.signal});
};
sit.addEventListener('keydown',e=>{if(e.key==='Enter')$('#search').click()});
})();
</script>
</body>
</html>
